[package]
name = "mizan-desktop"
description = "Mizan desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mizan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
mizan-import.workspace = true
mizan-core.workspace = true
mizan-storage.workspace = true
mizan-market.workspace = true
mizan-adapters.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["clock"] }
rust_decimal.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
mizan-core = { workspace = true, features = ["ts"] }
mizan-market = { workspace = true, features = ["ts"] }
ts-rs.workspace = true
