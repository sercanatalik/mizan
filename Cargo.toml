[workspace]
resolver = "2"
members = ["crates/mizan-import", "crates/mizan-core", "crates/mizan-storage", "crates/mizan-cli", "crates/mizan-market", "crates/mizan-adapters", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
mizan-import = { path = "crates/mizan-import" }
mizan-core = { path = "crates/mizan-core" }
mizan-storage = { path = "crates/mizan-storage" }
mizan-market = { path = "crates/mizan-market" }
mizan-adapters = { path = "crates/mizan-adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rust_decimal = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"
schemars = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
similar = "2"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
